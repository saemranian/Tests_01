<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DGS PlayCanvas Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      { "imports": { "playcanvas": "https://esm.run/playcanvas" } }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; }
        #canvas-container { position: absolute; inset: 0; overflow: hidden; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; cursor: default; }
        .loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: white; z-index: 100; transition: opacity 0.8s; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="mb-4 text-xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-300">Downloading 3DGS...</div>
        <div class="w-64 h-2 bg-gray-700 rounded-full overflow-hidden shadow-inner">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-teal-400 w-0 transition-all duration-300"></div>
        </div>
    </div>
    
    <div id="canvas-container">
        <canvas id="pc-canvas"></canvas>
    </div>
    
    <div id="annotations-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>
    
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-wrap justify-center gap-2 pointer-events-auto bg-gray-900/80 p-3 rounded-xl backdrop-blur-sm border border-gray-700 z-20 shadow-2xl" id="views-container"></div>

    <script type="module">
        import * as pc from 'playcanvas';
        
        const state = {"transform":{"x":0,"y":0,"z":0,"rx":180,"ry":0,"rz":0,"scale":1},"views":[{"name":"Cam1","pitch":-17.599999999999998,"yaw":-536.2000000000005,"distance":43.77209243042617,"target":{"x":1.5319342118995465,"y":20.329583551963136,"z":-1.3763671963573825}},{"name":"Cam2","pitch":-6.00000000000001,"yaw":-391.40000000000066,"distance":50,"target":{"x":-1.1031811985520505,"y":20.528487930593748,"z":-3.009341116603223}}],"annotations":[{"title":"Title 01","desc":"Description 01","x":5.5490112001211225,"y":15.848036140443206,"z":-2.6681108594099427,"color":"#a855f7","size":0.75},{"title":"T2","desc":"D2","x":8.67207629943682,"y":15.156468704984373,"z":-1.6800751443011643,"color":"#55f7b1","size":0.75},{"title":"T3","desc":"D3","x":6.479527805477587,"y":18.54431142057909,"z":10.271867164897328,"color":"#f78555","size":0.75},{"title":"T4","desc":"D4","x":6.153171661000028,"y":20.709980663950628,"z":10.615242766293361,"color":"#ff4d00","size":0.75},{"title":"T5","desc":"D5","x":7.246052644532673,"y":20.70998066245568,"z":9.456190791406176,"color":"#b33600","size":0.75}],"scene":{"toneMapping":3,"exposure":1},"cameraLimits":{"minDistance":0.1,"maxDistance":50,"minPitch":-30,"maxPitch":15},"exportUrl":"Aputure_1500w_3600ks_Sel01.compressed.ply"};
        let isRevealing = false;
        let revealProgress = 0;
        let mouseX = -1000, mouseY = -1000;
        
        const canvas = document.getElementById('pc-canvas');
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        window.addEventListener('mousemove', e => { 
            const coords = getCanvasCoords(e);
            mouseX = coords.x; mouseY = coords.y; 
        });
        
        const app = new pc.Application(canvas, { graphicsDeviceOptions: { antialias: true, alpha: false } });
        app.setCanvasFillMode(pc.FILLMODE_NONE);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        
        const resizeObs = new ResizeObserver(entries => { app.resizeCanvas(entries[0].contentRect.width, entries[0].contentRect.height); });
        resizeObs.observe(document.getElementById('canvas-container'));
        
        app.scene.gammaCorrection = pc.GAMMA_SRGB;
        app.scene.toneMapping = state.scene.toneMapping;
        app.scene.exposure = 0.001;

        const camera = new pc.Entity('Camera');
        camera.addComponent('camera', { clearColor: new pc.Color(0.05, 0.05, 0.08) });
        app.root.addChild(camera);

        const orbit = {
            pitch: 20, yaw: 45, distance: 5, target: new pc.Vec3(0,0,0),
            current: { pitch: 20, yaw: 45, distance: 5, target: new pc.Vec3(0,0,0) },
            update(dt) {
                const speed = Math.min(1.0, 8.0 * dt);
                this.current.pitch = pc.math.lerp(this.current.pitch, this.pitch, speed);
                this.current.yaw = pc.math.lerp(this.current.yaw, this.yaw, speed);
                this.current.distance = pc.math.lerp(this.current.distance, this.distance, speed);
                this.current.target.lerp(this.current.target, this.target, speed);

                const q = new pc.Quat().setFromEulerAngles(this.current.pitch, this.current.yaw, 0);
                const dir = new pc.Vec3(0, 0, 1);
                q.transformVector(dir, dir);
                dir.mulScalar(this.current.distance);
                
                const pos = this.current.target.clone().add(dir);
                camera.setPosition(pos);
                camera.lookAt(this.current.target);
            }
        };

        let splatEntity = null;

        const req = new XMLHttpRequest();
        req.open('GET', state.exportUrl, true);
        req.responseType = 'blob';
        req.onprogress = (e) => {
            if (e.lengthComputable) {
                const pct = (e.loaded / e.total) * 100;
                document.getElementById('progress-bar').style.width = pct + '%';
            }
        };
        req.onload = () => {
            if (req.status === 200) {
                const blobUrl = URL.createObjectURL(req.response);
                app.assets.loadFromUrl(blobUrl, 'gsplat', function (err, asset) {
                    const loaderEl = document.getElementById('loading');
                    if (err) { loaderEl.innerHTML = "Error loading 3DGS!"; return; }
                    
                    splatEntity = new pc.Entity();
                    splatEntity.addComponent('gsplat', { asset: asset });
                    splatEntity.setLocalPosition(state.transform.x, state.transform.y, state.transform.z);
                    splatEntity.setLocalEulerAngles(state.transform.rx, state.transform.ry, state.transform.rz);
                    splatEntity.setLocalScale(state.transform.scale, state.transform.scale, state.transform.scale);
                    app.root.addChild(splatEntity);
                    
                    loaderEl.style.opacity = '0';
                    isRevealing = true;
                    revealProgress = 0;
                });
            } else {
                document.getElementById('loading').innerHTML = "File not found: " + state.exportUrl;
            }
        };
        req.onerror = () => document.getElementById('loading').innerHTML = "Network Error loading 3DGS.";
        req.send();

        // -----------------------------------------------------
        // Controls: LOCKED to Saved Views Only (No free orbit/pan)
        // -----------------------------------------------------
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        const vC = document.getElementById('views-container');
        if (state.views.length === 0) {
            vC.style.display = 'none';
        } else {
            state.views.forEach(v => {
                const b = document.createElement('button');
                b.className = 'px-5 py-2.5 bg-gray-800 hover:bg-teal-600 border border-gray-600 text-white rounded-lg font-bold text-sm transition-colors shadow-lg';
                b.innerText = v.name;
                b.onclick = () => { 
                    orbit.pitch = v.pitch; orbit.yaw = v.yaw; 
                    orbit.distance = v.distance; 
                    orbit.target.set(v.target.x, v.target.y, v.target.z); 
                };
                vC.appendChild(b);
            });
            // Init Camera to first view instantly
            const v0 = state.views[0];
            orbit.pitch = v0.pitch; orbit.yaw = v0.yaw; orbit.distance = v0.distance;
            orbit.target.set(v0.target.x, v0.target.y, v0.target.z);
            orbit.current.pitch = v0.pitch; orbit.current.yaw = v0.yaw; 
            orbit.current.distance = v0.distance; orbit.current.target.set(v0.target.x, v0.target.y, v0.target.z);
        }

        const layer = document.getElementById('annotations-layer');
        state.annotations.forEach(ann => {
            const annMaterial = new pc.StandardMaterial();
            const c = new pc.Color().fromString(ann.color || '#a855f7');
            annMaterial.diffuse = c;
            annMaterial.emissive = new pc.Color(c.r*0.3, c.g*0.3, c.b*0.3);
            annMaterial.update();

            const annEntity = new pc.Entity();
            annEntity.addComponent('render', { type: 'sphere', material: annMaterial });
            const s = ann.size || 0.3;
            annEntity.setLocalScale(s, s, s);
            annEntity.setPosition(ann.x, ann.y, ann.z);
            app.root.addChild(annEntity);
            ann.entity = annEntity;

            const el = document.createElement('div');
            el.className = 'hidden absolute p-3 rounded-lg w-max max-w-[250px] bg-gray-900/95 text-white border border-gray-600 shadow-2xl z-50 transform -translate-x-1/2 -translate-y-[120%] pointer-events-none backdrop-blur-md';
            el.innerHTML = `
                <div class="font-bold text-base mb-1" style="color: ${ann.color || '#a855f7'}">${ann.title}</div>
                <div class="text-sm text-gray-300 whitespace-pre-wrap">${ann.desc}</div>
                <div class="absolute w-3 h-3 bg-gray-900/95 border-b border-r border-gray-600 transform rotate-45 left-1/2 -translate-x-1/2 -bottom-[7px]"></div>`;
            layer.appendChild(el);
            ann.labelEl = el;
        });

        app.on('update', (dt) => {
            orbit.update(dt);
            
            if (isRevealing) {
                revealProgress += dt * 0.6;
                const easeOut = 1 - Math.pow(1 - Math.min(1, revealProgress), 3);
                app.scene.exposure = pc.math.lerp(0.001, state.scene.exposure, easeOut);
                if (revealProgress >= 1) {
                    isRevealing = false;
                    app.scene.exposure = state.scene.exposure;
                }
            }

            state.annotations.forEach(ann => {
                if(!ann.entity || !ann.labelEl) return;
                const pos = ann.entity.getPosition();
                const screenPos = new pc.Vec3();
                camera.camera.worldToScreen(pos, screenPos);
                const dirToAnn = new pc.Vec3().sub2(pos, camera.getPosition());
                
                if (dirToAnn.dot(camera.forward) < 0) {
                    ann.labelEl.style.display = 'none';
                } else {
                    const dist = Math.sqrt(Math.pow(screenPos.x - mouseX, 2) + Math.pow(screenPos.y - mouseY, 2));
                    const threshold = 30 + ((ann.size || 0.3) * 20);
                    if (dist < threshold) {
                        ann.labelEl.style.display = 'block';
                        ann.labelEl.style.left = screenPos.x + 'px';
                        ann.labelEl.style.top = screenPos.y + 'px';
                    } else {
                        ann.labelEl.style.display = 'none';
                    }
                }
            });
        });
        app.start();
    </script>
</body>
</html>
